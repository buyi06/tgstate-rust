[package]
name = "tgstate"
version = "2.3.0"
edition = "2021"
description = "A Telegram-based private file storage system"
rust-version = "1.82"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "trace"] }

# Templating
tera = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# HTTP client
reqwest = { version = "0.12", features = ["stream", "multipart", "json"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Env
dotenvy = "0.15"

# Crypto
# `hex` is still used by `auth::generate_session_token` to encode the
# 32 random bytes as a 64-char hex session ID. `sha2` was previously used
# to derive a sha256(password) cookie; that scheme has been removed in
# favour of a random session token stored in SQLite, so `sha2` is no
# longer a direct dependency.
hex = "0.4"
argon2 = "0.5"
# 2FA（TOTP）与 API 密钥所需的哈希原语：
# hmac+sha1 → RFC 6238 动态码；sha2 → API 密钥 / 恢复码的 sha256；
# data-encoding → TOTP 密钥的 base32 编解码。
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
data-encoding = "2"

# 2FA 设置页的二维码（服务端渲染 SVG，避免引入外部 JS 破坏 CSP）
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
rand = "0.8"
mime_guess = "2"
percent-encoding = "2"
tokio-stream = "0.1"
futures = "0.3"
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
